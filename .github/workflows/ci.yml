name: CI

on:
  push:
    branches: [main]
    paths:
      - "dataset_desk/**"
      - "tests/**"
      - "atlas/**"
      - "verify.sh"
      - "pyproject.toml"
      - "codecov.yml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # Codecov upload over OIDC; no stored token
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (the package and its dev tools; no model libraries)
        run: python -m pip install -e ".[dev]"

      - name: Verify (lint, tests, smoke)
        run: bash verify.sh

      - name: Coverage (floor 90)
        if: matrix.python-version == '3.12'
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=90
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.12'
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: coverage.xml

      - name: Package (build, twine check, install smoke) and dependency audit
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build==1.6.1 twine==7.0.0 pip-audit==2.10.1
          python -m build -o dist
          python -m twine check --strict dist/*
          python -m venv /tmp/pkg && /tmp/pkg/bin/pip install -q dist/*.whl
          (cd /tmp && /tmp/pkg/bin/dataset-desk --help >/dev/null)
          python -m pip_audit --strict .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.python-version == '3.12'
        with:
          node-version: 22

      - name: Atlas check
        if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
