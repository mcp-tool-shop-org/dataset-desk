[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-desk"
version = "0.1.0"
description = "Make and review visual datasets: an image-text index for duplicates, search, outliers and coverage, and a model-free gate for image descriptions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10"]
keywords = ["dataset", "curation", "embeddings", "siglip2", "embeddinggemma", "lora", "image-captioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.51", "sentence-transformers>=3"]
dev = ["coverage[toml]>=7.5", "ruff>=0.6"]

[project.scripts]
dataset-desk = "dataset_desk.desk:run"

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/dataset-desk/"
Repository = "https://github.com/mcp-tool-shop-org/dataset-desk"
Issues = "https://github.com/mcp-tool-shop-org/dataset-desk/issues"

[tool.setuptools]
packages = ["dataset_desk"]

[tool.setuptools.package-data]
dataset_desk = ["stopwords.txt"]

[tool.coverage.run]
source = ["dataset_desk"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"
